
name: Build Xray iOS

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      - name: List Xcode projects
        run: |
          find . -maxdepth 4 \( -name "*.xcodeproj" -o -name "*.xcworkspace" \)

      - name: List schemes
        run: |
          find . -name "*.xcodeproj" -print0 | while IFS= read -r -d '' project; do
            echo "Project: $project"
            xcodebuild -list -project "$project" || true
          done
