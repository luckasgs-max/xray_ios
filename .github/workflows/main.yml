
name: Build Xray iOS

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Xray
        run: |
          set -o pipefail
          xcodebuild \
            -project Xray.xcodeproj \
            -scheme Xray \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Package IPA
        run: |
          mkdir -p build/Payload
          cp -R build/DerivedData/Build/Products/Release-iphoneos/Xray.app build/Payload/
          cd build
          zip -r Xray-unsigned.ipa Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: Xray-unsigned-IPA
          path: build/Xray-unsigned.ipa
          retention-days: 7
